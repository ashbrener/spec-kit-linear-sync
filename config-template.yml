# spec-kit-linear — per-consumer-repo configuration template
#
# Role: declares everything the bridge needs to talk to one Linear
# workspace+team+project from one consumer repo. Lives at
# `.specify/extensions/linear/linear-config.yml` in the consumer repo.
#
# Install path: `specify extension add linear` ships THIS file into
# `.specify/extensions/linear/config-template.yml` via copytree, but the
# CLI does NOT auto-rename it (recon: extension-shape-recon.md §1, §5
# Q1). Either the operator or `speckit.linear.install`'s first-run copy
# step renames `config-template.yml` → `linear-config.yml` and fills in
# the UUIDs. The seed step (`speckit.linear.seed`, FR-021/FR-032) then
# populates `linear.workflow_state_uuids`.
#
# Two-file model (spec 004 — config / identity split):
#   * THIS FILE — `linear-config.yml` — is COMMITTED. It holds ONLY the
#     shareable binding (team/project UUIDs, workflow-state + label UUID
#     maps, behaviour toggles). Cloning the repo gives a collaborator
#     everything they need to sync; none of it is personal (FR-001,
#     FR-004, Principle V — repo is self-describing).
#   * Operator IDENTITY (`user_id`, name, email) lives in a SEPARATE,
#     gitignored, operator-local file:
#         `.specify/extensions/linear/linear-operator.local.yml`
#     It is NEVER committed. `speckit.linear.install` scaffolds it and
#     ensures `.gitignore` covers `*.local.yml` (FR-002, FR-003).
#   * Secrets (LINEAR_API_KEY) live in env vars, the operator-local
#     file, or `.env` (gitignored) — never here.
#
# Resolution cascade (both identity and API key): environment →
# operator-local file → interactive prompt (FR-005, FR-006). Reconcile
# resolves the operator assignee via this cascade and NEVER reads
# identity from this committed file.
#
# Hand-edit policy: `linear.*.id` (UUIDs) and `linear.workflow_state_uuids`
# come from `speckit.linear.install` / `speckit.linear.seed`. Do NOT
# edit by hand unless you know what you're doing — lookups are by UUID,
# never by name (FR-032), so a wrong UUID silently breaks sync.

schema_version: 1          # template schema; bump if shape changes
config_version: 2          # spec 004: operator identity moved to the
                           # operator-local file; bump if operator hand-edits

# Linear binding — resolved at install time (FR-002).
linear:
  workspace:
    name: "ACME"             # informational (display only)
    url_key: "acme"          # informational (workspace URL slug)
  team:
    id: "00000000-0000-0000-0000-000000000000"   # Required (FR-002) — UUID is authoritative
    key: "ACM"                    # informational; not used for lookup
    name: "ACME"             # informational
  project:
    id: "00000000-0000-0000-0000-000000000000"   # Required (FR-002) — UUID is authoritative
    name: "spec-kit-linear"        # informational (display only)
  # NOTE: operator identity is intentionally ABSENT from this committed
  # file (spec 004). `user_id`, name, and email live in the gitignored
  # operator-local file `linear-operator.local.yml` and resolve via the
  # env → local-file → prompt cascade (FR-002, FR-005). A legacy config
  # that still carries an `operator:` block here is migrated out of it
  # automatically, once, on first load (FR-007).
  # Workflow state UUIDs captured by the seed step (FR-021 + FR-032).
  # Keys are the canonical lifecycle-phase identifiers. Lookup is by
  # UUID, never by name — Linear UI renames are safe; deletion surfaces
  # as an explicit error.
  workflow_state_uuids:
    specifying:     "00000000-0000-0000-0000-000000000000"   # Required (FR-032)
    clarifying:     "00000000-0000-0000-0000-000000000000"   # Required (FR-032)
    planning:       "00000000-0000-0000-0000-000000000000"   # Required (FR-032)
    tasking:        "00000000-0000-0000-0000-000000000000"   # Required (FR-032)
    red_team:       "00000000-0000-0000-0000-000000000000"   # Required (FR-032)
    implementing:   "00000000-0000-0000-0000-000000000000"   # Required (FR-032)
    analyzing:      "00000000-0000-0000-0000-000000000000"   # Required (FR-032)
    ready_to_merge: "00000000-0000-0000-0000-000000000000"   # Required (FR-032)
    merged:         "00000000-0000-0000-0000-000000000000"   # Required (FR-032)
  # Default workflow-state UUIDs for task-phase SUB-ISSUES (one sub-issue
  # per row in tasks.md). These are NOT the lifecycle phases above — the
  # lifecycle states drive the parent spec Issue's progression through the
  # /speckit-* commands (specifying → clarifying → … → merged), while
  # `default_state_uuids` drives the much simpler todo/in_progress/done
  # tri-state that each individual task sub-issue moves through as
  # `/speckit-implement` ticks rows off in tasks.md.
  #
  # Captured by the seed step alongside `workflow_state_uuids` (FR-021 +
  # FR-032). Lookup is by UUID, never by name — Linear UI renames are safe;
  # deletion of a referenced state surfaces as an explicit error.
  default_state_uuids:
    todo:           "00000000-0000-0000-0000-000000000000"   # Required (FR-032) — sub-issue created, not yet started
    in_progress:    "00000000-0000-0000-0000-000000000000"   # Required (FR-032) — task row in-flight
    done:           "00000000-0000-0000-0000-000000000000"   # Required (FR-032) — task row ticked complete
  # Agent provenance label UUIDs (FR-036). The seed step creates the
  # workspace-scoped `agent:claude` / `agent:codex` labels and captures
  # their UUIDs here so the reconciler can stamp every Issue / sub-issue
  # with a sticky family label identifying which AI agent ran the sync.
  # Non-canonical agents (resolved from AGENT_NAME, e.g. `gemini`) mint
  # their labels lazily at sync time and do NOT require an entry here.
  agent_label_uuids:
    claude:         "00000000-0000-0000-0000-000000000000"   # FR-036 — set by seed
    codex:          "00000000-0000-0000-0000-000000000000"   # FR-036 — set by seed
  # Seed scope (spec 005 — team-scoped / non-admin seeding, FR-005).
  # Controls the breadth at which `/spec-kit-linear-seed` creates labels:
  #   * team      — labels created scoped to the team above (teamId set).
  #                 Needs ONLY team-level permission, so a sub-team owner
  #                 can seed without workspace-admin. THE DEFAULT.
  #   * workspace — labels created workspace-wide (teamId omitted). Needs
  #                 workspace-admin. The pre-005 behaviour.
  # Whatever the scope, if a required state/label cannot be CREATED (no
  # permission) but already EXISTS, seed ADOPTS it by name and captures
  # its UUID — needing zero create permission. Omitting this block (or the
  # whole `seed:` key) keeps the default `team` so a pre-005 config works
  # unedited. Override per-run with `/spec-kit-linear-seed --scope <…>`.
  seed:
    scope: team   # workspace | team   (default: team)

# Behavior toggles — operator-tweakable.
sync:
  enabled: true              # If false, /speckit-* hooks skip Linear writes;
                             # `speckit.linear.push` still works manually. (FR-031)
  idle_window_days: 30       # Days before repo's Project Status flips to "Paused"
                             # if no spec touched. 0 disables. (FR-002)
  emit_summary: true         # Print structured sync summary every run (FR-023).

# Webhook (Layer E) — populated by `speckit.linear.install` if opted in (FR-027).
webhook:
  installed: false                                       # flip true when YAML is committed
  workflow_path: ".github/workflows/spec-kit-linear-sync.yml"   # (FR-027)
  secret_name: "LINEAR_API_TOKEN"                        # GitHub repo secret name (FR-029)

# Local git hooks — populated by `speckit.linear.install` (FR-033).
# `.git/hooks/` is not versioned, so install is per-clone and re-runs
# under FR-018b's dependency-verification contract.
git_hooks:
  installed: false
  hooks:
    - post-checkout    # branch / worktree switch → reconcile
    - post-commit      # local commit may tick a task → reconcile
    - post-merge       # local merge → reconcile

# ---
# How to bootstrap (first install, fresh consumer repo):
#   1. `specify extension add linear`                 # copies this template
#   2. `cp config-template.yml linear-config.yml`     # rename for the bridge to find it
#   3. `/spec-kit-linear-install`                      # fills linear.{team,project}.id,
#                                                     # scaffolds linear-operator.local.yml
#                                                     # (gitignored identity), installs
#                                                     # webhook + git hooks, registers hooks
#   4. `/spec-kit-linear-seed`                         # creates workflow states + labels,
#                                                     # fills workflow_state_uuids
#   5. Commit `linear-config.yml` (safe — no identity). Sync is now live
#      (FR-001, FR-004, Principle V). Do NOT commit
#      `linear-operator.local.yml` — it is gitignored by install.
